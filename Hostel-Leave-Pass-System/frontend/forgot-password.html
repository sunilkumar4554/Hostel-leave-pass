<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | HostelPass</title><link rel="stylesheet" href="/assets/css/styles.css"></head><body class="form-page"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">H</span><span>Hostel<span class="brand-light">Pass</span><small>ACCOUNT RECOVERY</small></span></a><a class="back-link inline-back" href="/">← Back to portals</a></header><main class="recovery-shell"><div class="recovery-icon">✉</div><div class="section-kicker">ACCOUNT RECOVERY</div><h1>Reset your password</h1><p class="muted">Request an email code, then choose a new password. SMTP must be configured in the project's .env file.</p><div id="alert" class="alert hidden"></div><form id="otp-form" class="form-card recovery-card"><label>Email address<input type="email" id="reset-email" required placeholder="Your registered email"></label><button class="btn btn-secondary btn-full" type="submit">Send reset code</button></form><form id="reset-form" class="form-card recovery-card"><label>6-digit email code<input id="reset-otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="000000"></label><label>New password<input id="new-password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"></label><button class="btn btn-primary btn-full" type="submit">Reset password</button></form><p class="form-end"><a href="/student-login.html">Return to student login</a></p></main><script src="/assets/js/common.js"></script><script src="/assets/js/auth.js"></script><script>setupForgotPassword();</script></body></html>
